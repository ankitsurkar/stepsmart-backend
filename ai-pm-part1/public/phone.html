<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var s = localStorage.getItem('aipm-color-scheme');
      if (s === 'light' || s === 'dark') document.querySelector('meta[name="color-scheme"]').content = s;
    } catch (e) {}
  </script>
  <title>The AI PM, Part 1 | Phone</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="phone-page">
  <div class="phone-shell">
    <header class="phone-header">
      <span class="phone-brand">The AI PM · Part 1</span>
      <span class="pill" id="phoneStagePill">Connecting</span>
    </header>

    <div id="phoneReconnectSlot"></div>

    <main class="phone-main" id="phoneMain"></main>
  </div>

  <script type="module" src="/js/phone.js"></script>
</body>
</html>
