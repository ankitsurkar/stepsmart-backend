<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var s = localStorage.getItem('aipm-color-scheme');
      if (s === 'light' || s === 'dark') document.querySelector('meta[name="color-scheme"]').content = s;
    } catch (e) {}
  </script>
  <title>Replay Edition | The AI PM, Part 1</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="phone-page">
  <div class="phone-shell">
    <header class="phone-header">
      <span class="phone-brand">The AI PM · Replay</span>
      <span class="pill" id="replayStagePill">Replay</span>
    </header>

    <main class="phone-main" id="replayMain"></main>

    <nav class="replay-nav" aria-label="Replay navigation">
      <button type="button" class="btn" id="replayPrevBtn" style="flex: 1;">← Back</button>
      <span id="replayProgress" class="pill tabular" style="align-self: center;">1 / 1</span>
      <button type="button" class="btn btn-primary" id="replayNextBtn" style="flex: 1;">Next →</button>
    </nav>
  </div>

  <script type="module" src="/js/replay.js"></script>
</body>
</html>
