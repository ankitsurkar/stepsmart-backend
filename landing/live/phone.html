<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var s = localStorage.getItem('aipm-color-scheme');
      if (s === 'light' || s === 'dark') document.querySelector('meta[name="color-scheme"]').content = s;
    } catch (e) {}
  </script>
  <title>The AI PM, Part 1 | Phone</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="phone-page">
  <div class="phone-shell">
    <header class="phone-header">
      <div class="phone-brand-group">
        <img src="./stepsmart-logo.webp" alt="StepSmart Logo" width="24" height="24" style="width: 24px; height: 24px; object-fit: contain;" onerror="this.src='/stepsmart-logo.png'">
        <span class="phone-brand-title">StepSmart</span>
        <span class="phone-brand-sub">· The AI PM</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button type="button" class="btn" id="phoneResetProfileBtn" style="display: none; min-block-size: 28px; padding: 2px 10px; font-size: 12px;">Edit answers</button>
        <span class="pill" id="phoneStagePill">Connecting</span>
      </div>
    </header>

    <div id="phoneReconnectSlot"></div>

    <main class="phone-main" id="phoneMain"></main>
  </div>

  <script type="module" src="./js/phone.js"></script>
</body>
</html>
