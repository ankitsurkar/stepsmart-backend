<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Which PM Are You? • StepSmart Teaser</title>
  
  <style>
    /* CSS Variables for Dark Violet / Amber Marquee & Light Mode */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #2a0b4d 0%, #150627 65%, #0d0319 100%);
      --bg-color: #140626;
      --card-bg: rgba(26, 9, 48, 0.94);
      --card-border: #F59E0B;
      --text-main: #FDFCF7;
      --text-muted: #D1C4E9;
      --accent-gold: #F59E0B;
      --accent-bright: #FBBF24;
      --accent-light: #FEF3C7;
      --wheel-bezel: #D97706;
      --bulb-off: #3D2206;
      --bulb-on: #FBBF24;
      --bulb-glow: rgba(245, 158, 11, 0.85);
      --btn-primary-bg: #F59E0B;
      --btn-primary-text: #17072B;
      --btn-primary-shadow: #B45309;
      --btn-secondary-bg: rgba(255, 255, 255, 0.08);
      --btn-secondary-text: #FDFCF7;
      --btn-secondary-border: rgba(245, 158, 11, 0.5);
      --overlay-bg: rgba(10, 3, 20, 0.82);
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 30%, #F5F0FF 0%, #EFE8FA 65%, #E5DCF5 100%);
      --bg-color: #EFE8FA;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: #8B5CF6;
      --text-main: #1D0E33;
      --text-muted: #6B5B82;
      --accent-gold: #D97706;
      --accent-bright: #F59E0B;
      --accent-light: #7C3AED;
      --wheel-bezel: #B45309;
      --bulb-off: #C7B49B;
      --bulb-on: #F59E0B;
      --bulb-glow: rgba(217, 119, 6, 0.7);
      --btn-primary-bg: #1D0E33;
      --btn-primary-text: #FFF8E7;
      --btn-primary-shadow: #000000;
      --btn-secondary-bg: #FFFFFF;
      --btn-secondary-text: #1D0E33;
      --btn-secondary-border: #1D0E33;
      --overlay-bg: rgba(29, 14, 51, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 1rem 1rem 1.5rem;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0.5rem;
      z-index: 10;
    }

    .brand-pill {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.75rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-bright);
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand-pill .dot {
      width: 7px;
      height: 7px;
      background: var(--accent-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-gold);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.4rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      z-index: 10;
      max-width: 440px;
    }

    h1.main-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    h1.main-title span.highlight {
      color: var(--accent-bright);
      font-style: italic;
    }

    p.subtitle {
      font-size: clamp(0.95rem, 3.8vw, 1.1rem);
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.4;
    }

    /* Marquee Wheel Stage */
    .wheel-stage {
      position: relative;
      width: min(88vw, 360px);
      height: min(88vw, 360px);
      margin: 1.25rem auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer ambient glow */
    .wheel-ambient-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, rgba(245, 158, 11, 0) 72%);
      pointer-events: none;
      z-index: 1;
      filter: blur(10px);
    }

    /* Bulb Ring */
    .bulbs-container {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
    }

    .bulb {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bulb-off);
      border: 1.5px solid rgba(0, 0, 0, 0.4);
      top: 50%;
      left: 50%;
      margin-top: -6px;
      margin-left: -6px;
      transition: background 0.08s ease, box-shadow 0.08s ease, transform 0.08s ease;
    }

    .bulb.lit {
      background: radial-gradient(circle at 40% 35%, #FFFDF5 0%, #FBBF24 50%, #D97706 100%);
      box-shadow: 0 0 8px var(--bulb-on), 0 0 16px var(--bulb-glow), inset 0 0 2px #FFFFFF;
      transform: scale(1.15);
    }

    /* Marquee Rim / Bezel */
    .marquee-rim {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 4px solid var(--wheel-bezel);
      background: #17072B;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.2);
      z-index: 2;
    }

    /* Canvas Wheel */
    #wheelCanvas {
      position: absolute;
      inset: 16px;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      border-radius: 50%;
      z-index: 3;
      cursor: pointer;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }

    /* Golden Pointer */
    .pointer-wrap {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.65));
      transition: transform 0.05s ease-out;
    }

    .pointer-svg {
      width: 32px;
      height: 42px;
      display: block;
    }

    /* Center Hub Badge */
    .center-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFBEB 0%, #F59E0B 45%, #92400E 100%);
      border: 3px solid #FEF3C7;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      user-select: none;
      pointer-events: none;
    }

    /* Spin Button Section */
    .controls-section {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      z-index: 10;
    }

    .spin-btn {
      width: 100%;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 1.05rem 2rem;
      border: 3px solid #140626;
      border-radius: 14px;
      box-shadow: 0 6px 0 var(--btn-primary-shadow), 0 10px 24px rgba(245, 158, 11, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.12s ease;
      position: relative;
      overflow: hidden;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 var(--btn-primary-shadow), 0 14px 28px rgba(245, 158, 11, 0.55);
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--btn-primary-shadow), 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .spin-btn:disabled {
      opacity: 0.85;
      cursor: not-allowed;
      filter: saturate(0.8);
      transform: translateY(2px);
      box-shadow: 0 4px 0 var(--btn-primary-shadow);
    }

    .spin-counter-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Result Modal / Slide-Up Card */
    .result-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .result-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .result-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-bottom: none;
      border-radius: 28px 28px 0 0;
      padding: 1.75rem 1.5rem 2.25rem;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.6);
      transform: translateY(105%);
      transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .result-overlay.active .result-sheet {
      transform: translateY(0);
    }

    .drag-handle {
      width: 44px;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      margin-bottom: 1.1rem;
    }

    .result-emoji {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
      animation: emojiPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes emojiPop {
      0% { transform: scale(0.4) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .result-tag-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.85rem, 6vw, 2.3rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 0.65rem;
    }

    .result-caption {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(1.05rem, 3.8vw, 1.2rem);
      color: var(--accent-bright);
      line-height: 1.45;
      margin-bottom: 1.1rem;
      max-width: 380px;
    }

    .result-disclaimer {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.85;
      margin-bottom: 1.4rem;
      padding-bottom: 1.1rem;
      border-bottom: 1px dashed rgba(245, 158, 11, 0.3);
      width: 100%;
    }

    /* Action Buttons in Result */
    .result-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 1.4rem;
    }

    .btn-register {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 0.95rem 1.5rem;
      border-radius: 12px;
      border: 2px solid #140626;
      box-shadow: 0 4px 0 var(--btn-primary-shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.12s ease;
      width: 100%;
    }

    .btn-register:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--btn-primary-shadow);
    }

    .btn-share-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      width: 100%;
    }

    .btn-share {
      background: #25D366;
      color: #0B3819;
      font-size: 0.98rem;
      font-weight: 800;
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      border: 2px solid #140626;
      box-shadow: 0 3px 0 #128C7E;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.12s ease;
    }

    .btn-share:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #128C7E;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.12s ease;
      white-space: nowrap;
    }

    .btn-copy:active {
      transform: scale(0.97);
    }

    .btn-spin-again {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 2px solid var(--btn-secondary-border);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      width: 100%;
    }

    .btn-spin-again:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--accent-gold);
    }

    /* Teaser Live Event Footer Notice */
    .result-live-notice {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 360px;
    }

    .result-live-notice strong {
      color: var(--accent-bright);
      font-weight: 700;
    }

    /* Toast Notification for Copy */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #140626;
      color: #FBBF24;
      border: 2px solid #F59E0B;
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Small Screen Adjustments */
    @media (max-height: 680px) {
      .wheel-stage {
        width: 300px;
        height: 300px;
        margin: 0.75rem auto 1rem;
      }
      h1.main-title {
        font-size: 1.85rem;
      }
      p.subtitle {
        font-size: 0.9rem;
      }
      .spin-btn {
        padding: 0.85rem 1.5rem;
        font-size: 1.1rem;
      }
      .result-sheet {
        padding: 1.25rem 1.25rem 1.75rem;
      }
      .result-emoji {
        font-size: 3.2rem;
        margin-bottom: 0.4rem;
      }
      .result-tag-title {
        font-size: 1.65rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar with Teaser Badge and Theme Toggle -->
  <header class="top-bar">
    <div class="brand-pill">
      <span class="dot"></span>
      <span>The AI PM • Teaser</span>
    </div>
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Dark</span>
    </button>
  </header>

  <!-- Title & Subtitle Screen 1 -->
  <section class="header-section">
    <h1 class="main-title">Which PM <span class="highlight">are you?</span></h1>
    <p class="subtitle">Spin to find your tag. Just for fun.</p>
  </section>

  <!-- Marquee Wheel Stage -->
  <div class="wheel-stage" id="wheelStage">
    <div class="wheel-ambient-glow"></div>
    <div class="marquee-rim"></div>
    
    <!-- Bulb Ring -->
    <div class="bulbs-container" id="bulbsContainer"></div>

    <!-- Golden Pointer -->
    <div class="pointer-wrap" id="pointerWrap">
      <svg class="pointer-svg" viewBox="0 0 32 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 42L2 14C-1 8 3 0 10 0H22C29 0 33 8 30 14L16 42Z" fill="url(#pointerGoldGrad)" stroke="#140626" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="16" cy="12" r="5" fill="#140626" />
        <circle cx="16" cy="12" r="3" fill="#FDE68A" />
        <defs>
          <linearGradient id="pointerGoldGrad" x1="16" y1="0" x2="16" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFBEB"/>
            <stop offset="0.35" stop-color="#FBBF24"/>
            <stop offset="0.75" stop-color="#F59E0B"/>
            <stop offset="1" stop-color="#B45309"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Canvas Wheel -->
    <canvas id="wheelCanvas" width="680" height="680"></canvas>

    <!-- Center Hub -->
    <div class="center-hub" id="centerHub" aria-hidden="true">
      <span>🎡</span>
    </div>
  </div>

  <!-- Big SPIN Button -->
  <div class="controls-section">
    <button id="spinBtn" class="spin-btn">
      <span>SPIN THE WHEEL</span>
      <span aria-hidden="true">➜</span>
    </button>
    <div id="spinCounterBadge" class="spin-counter-badge" style="display: none;">
      Spin #1
    </div>
  </div>

  <!-- Result Card (Slide-Up Modal) -->
  <div class="result-overlay" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTagTitle">
    <div class="result-sheet">
      <div class="drag-handle"></div>

      <div class="result-emoji" id="resultEmoji">😎</div>
      <h2 class="result-tag-title" id="resultTagTitle">Born to Be PM</h2>
      <p class="result-caption" id="resultCaption">“It was always on the roadmap.”</p>
      
      <div class="result-actions">
        <!-- Register Button (Primary) -->
        <a id="registerBtn" class="btn-register" href="#" target="_self">
          <span>REGISTER FOR FREE</span>
          <span>➜</span>
        </a>

        <!-- WhatsApp Share & Copy Link -->
        <div class="btn-share-row">
          <a id="whatsappShareBtn" class="btn-share" href="#" target="_blank" rel="noopener noreferrer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.301-.15-1.782-.879-2.058-.98-.276-.1-.476-.15-.676.15-.2.3-.776.98-.952 1.18-.175.2-.35.225-.651.075s-1.272-.469-2.424-1.496c-.896-.799-1.501-1.786-1.677-2.086-.175-.3-.019-.462.131-.611.136-.134.301-.35.451-.525.15-.175.2-.3.301-.5.1-.2.05-.375-.025-.525s-.676-1.631-.926-2.233c-.244-.585-.492-.506-.676-.515l-.576-.01c-.2 0-.525.075-.8.375s-1.05 1.026-1.05 2.502 1.075 2.9 1.225 3.101c.15.2 2.115 3.23 5.124 4.529.716.309 1.275.494 1.71.633.72.229 1.375.197 1.892.12.578-.087 1.782-.728 2.032-1.431.25-.703.25-1.305.175-1.431-.075-.126-.275-.201-.576-.351zM12.04 2C6.51 2 2.025 6.485 2.025 12.015c0 1.93.55 3.73 1.501 5.255L2 22l4.87-1.474c1.474.875 3.2 1.375 5.17 1.375 5.53 0 10.015-4.485 10.015-10.015S17.57 2 12.04 2z"/>
            </svg>
            <span>Share</span>
          </a>

          <button id="copyLinkBtn" class="btn-copy" type="button" aria-label="Copy link to clipboard">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyBtnText">Copy</span>
          </button>
        </div>

        <!-- Spin Again Button -->
        <button id="spinAgainBtn" class="btn-spin-again" type="button">
          <span>SPIN AGAIN</span>
          <span id="spinAgainCounter" style="opacity: 0.75;">(Spin #2)</span>
        </button>
      </div>

      <!-- Live Session Teaser Notice -->
      <div class="result-live-notice" id="liveSessionNotice">
        The real spin happens live on <strong id="liveDateDisplay">Sunday, 3:00 PM IST</strong>.<br />
        <strong>The AI PM: The Making.</strong> Free. Limited seats.
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span>✓ Link copied to clipboard!</span>
  </div>

  <script>
    (function () {
      "use strict";

      // 8 Equal Slices - Exact Result Content with curly apostrophes & quotes
      var WHEEL_ITEMS = [
        {
          label: "Born to Be",
          tagTitle: "Born to Be PM",
          emoji: "😎",
          caption: "“It was always on the roadmap.”",
          sliceBg: "#2E1052",
          sliceText: "#FEF3C7"
        },
        {
          label: "Swag",
          tagTitle: "Swag PM",
          emoji: "🕶️",
          caption: "“Walks into the meeting. Priorities rearrange themselves.”",
          sliceBg: "#F59E0B",
          sliceText: "#1A0830"
        },
        {
          label: "No-Fuss",
          tagTitle: "No-Fuss PM",
          emoji: "🎯",
          caption: "“No slides, no drama. Just ships.”",
          sliceBg: "#3B1466",
          sliceText: "#FEF3C7"
        },
        {
          label: "But Why?",
          tagTitle: "The “But Why?” PM",
          emoji: "🔍",
          caption: "“Asks why seven times. Finds the real problem on the eighth.”",
          sliceBg: "#F59E0B",
          sliceText: "#1A0830"
        },
        {
          label: "Chaos Calmer",
          tagTitle: "Chaos Calmer",
          emoji: "🧘",
          caption: "“Deadline moved up? Scope doubled? Still sipping chai.”",
          sliceBg: "#2E1052",
          sliceText: "#FEF3C7"
        },
        {
          label: "Thala",
          tagTitle: "Thala PM",
          emoji: "👑",
          caption: "“Leads from the front. Finishes what the team started.”",
          sliceBg: "#F59E0B",
          sliceText: "#1A0830"
        },
        {
          label: "Jugaad",
          tagTitle: "Jugaad PM",
          emoji: "🛠️",
          caption: "“Ships with what’s available. Somehow it works.”",
          sliceBg: "#3B1466",
          sliceText: "#FEF3C7"
        },
        {
          label: "Metrics",
          tagTitle: "Metric Magician",
          emoji: "📈",
          caption: "“Makes the graph go up and the room go quiet.”",
          sliceBg: "#F59E0B",
          sliceText: "#1A0830"
        }
      ];

      var NUM_SLICES = WHEEL_ITEMS.length;
      var SLICE_ANGLE = 360 / NUM_SLICES; // 45 degrees

      // DOM Elements
      var canvas = document.getElementById("wheelCanvas");
      var ctx = canvas.getContext("2d");
      var bulbsContainer = document.getElementById("bulbsContainer");
      var pointerWrap = document.getElementById("pointerWrap");
      var spinBtn = document.getElementById("spinBtn");
      var spinCounterBadge = document.getElementById("spinCounterBadge");
      var resultOverlay = document.getElementById("resultOverlay");
      var resultEmoji = document.getElementById("resultEmoji");
      var resultTagTitle = document.getElementById("resultTagTitle");
      var resultCaption = document.getElementById("resultCaption");
      var registerBtn = document.getElementById("registerBtn");
      var whatsappShareBtn = document.getElementById("whatsappShareBtn");
      var copyLinkBtn = document.getElementById("copyLinkBtn");
      var copyBtnText = document.getElementById("copyBtnText");
      var spinAgainBtn = document.getElementById("spinAgainBtn");
      var spinAgainCounter = document.getElementById("spinAgainCounter");
      var liveDateDisplay = document.getElementById("liveDateDisplay");
      var themeToggleBtn = document.getElementById("themeToggleBtn");
      var themeIcon = document.getElementById("themeIcon");
      var themeLabel = document.getElementById("themeLabel");
      var toast = document.getElementById("toast");

      // State
      var isSpinning = false;
      var currentAngle = 0; // In degrees
      var spinCount = 0;
      var lastTickIndex = -1;
      var bulbElements = [];
      var NUM_BULBS = 24;
      var bulbAnimId = null;
      var audioCtxInstance = null;

      // Extract URL params if customized
      var urlParams = new URLSearchParams(window.location.search);
      var customDate = urlParams.get("date") || "Sunday";
      var customTime = urlParams.get("time") || "3:00 PM IST";
      liveDateDisplay.textContent = customDate + ", " + customTime;

      var baseRegisterUrl = urlParams.get("reg") || urlParams.get("register") || "https://docs.google.com/forms/d/e/1FAIpQLSdRBsOZLN4E4cJh-l7b4NYTEisRemCTpPsoBZEAboHQk67tlA/viewform?usp=publish-editor";
      var trackingSeparator = baseRegisterUrl.indexOf("?") === -1 ? "?" : "&";
      var registerWithTracking = baseRegisterUrl + trackingSeparator + "utm_source=pm_spinner&utm_medium=result_card&utm_campaign=ai_pm_making";
      registerBtn.href = registerWithTracking;

      // --- Marquee Bulbs Setup ---
      function setupBulbs() {
        bulbsContainer.innerHTML = "";
        bulbElements = [];
        var stageRadius = bulbsContainer.clientWidth / 2;
        var bulbRadius = stageRadius - 6;

        for (var i = 0; i < NUM_BULBS; i++) {
          var angleDeg = (i * 360) / NUM_BULBS;
          var angleRad = (angleDeg * Math.PI) / 180;
          var bx = stageRadius + bulbRadius * Math.sin(angleRad);
          var by = stageRadius - bulbRadius * Math.cos(angleRad);

          var b = document.createElement("div");
          b.className = "bulb";
          b.style.left = bx + "px";
          b.style.top = by + "px";
          bulbsContainer.appendChild(b);
          bulbElements.push(b);
        }
      }

      // Bulb Chasing / Idle Pattern
      var bulbTick = 0;
      function animateBulbs() {
        bulbTick++;
        if (isSpinning) {
          // Rapid chase in direction of spin
          var activeIndex = bulbTick % NUM_BULBS;
          for (var i = 0; i < NUM_BULBS; i++) {
            var diff = (i - activeIndex + NUM_BULBS) % NUM_BULBS;
            if (diff < 4) {
              bulbElements[i].classList.add("lit");
            } else {
              bulbElements[i].classList.remove("lit");
            }
          }
        } else {
          // Gentle theater alternating marquee
          var isAlt = Math.floor(bulbTick / 25) % 2;
          for (var j = 0; j < NUM_BULBS; j++) {
            if ((j % 2) === isAlt) {
              bulbElements[j].classList.add("lit");
            } else {
              bulbElements[j].classList.remove("lit");
            }
          }
        }
        bulbAnimId = requestAnimationFrame(animateBulbs);
      }

      function flashCelebrationBulbs() {
        var count = 0;
        var flashTimer = setInterval(function () {
          count++;
          var turnOn = count % 2 === 1;
          for (var i = 0; i < NUM_BULBS; i++) {
            if (turnOn) {
              bulbElements[i].classList.add("lit");
            } else {
              bulbElements[i].classList.remove("lit");
            }
          }
          if (count > 6) {
            clearInterval(flashTimer);
          }
        }, 120);
      }

      // --- Web Audio Synthesized Click & Haptics ---
      function playTickSound() {
        try {
          if (!audioCtxInstance) {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              audioCtxInstance = new AudioContextClass();
            }
          }
          if (audioCtxInstance && audioCtxInstance.state === "suspended") {
            audioCtxInstance.resume();
          }
          if (audioCtxInstance && audioCtxInstance.state === "running") {
            var osc = audioCtxInstance.createOscillator();
            var gain = audioCtxInstance.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(700, audioCtxInstance.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtxInstance.currentTime + 0.015);
            gain.gain.setValueAtTime(0.09, audioCtxInstance.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtxInstance.currentTime + 0.015);
            osc.connect(gain);
            gain.connect(audioCtxInstance.destination);
            osc.start();
            osc.stop(audioCtxInstance.currentTime + 0.015);
          }
        } catch (e) {
          // Graceful fallback
        }

        // Haptic feedback if supported
        if (navigator.vibrate) {
          try {
            navigator.vibrate(8);
          } catch (e) {}
        }

        // Mechanical pointer bounce
        pointerWrap.style.transform = "translateX(-50%) rotate(-7deg)";
        setTimeout(function () {
          pointerWrap.style.transform = "translateX(-50%) rotate(0deg)";
        }, 45);
      }

      // --- Draw High-DPI Wheel on Canvas ---
      function drawWheel(rotationDeg) {
        var width = canvas.width;
        var height = canvas.height;
        var cx = width / 2;
        var cy = height / 2;
        var radius = cx - 18;

        ctx.clearRect(0, 0, width, height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((rotationDeg * Math.PI) / 180);

        for (var i = 0; i < NUM_SLICES; i++) {
          var item = WHEEL_ITEMS[i];
          var startAngle = (i * SLICE_ANGLE * Math.PI) / 180;
          var endAngle = ((i + 1) * SLICE_ANGLE * Math.PI) / 180;

          // Slice wedge
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = item.sliceBg;
          ctx.fill();

          // Slice Divider Border
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#F59E0B";
          ctx.stroke();

          // Draw Text along Slice Bisector
          ctx.save();
          var midAngle = startAngle + (SLICE_ANGLE * Math.PI) / 360;
          ctx.rotate(midAngle);

          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = item.sliceText;
          ctx.font = "bold 26px Georgia, serif";

          // Shadow for high readability
          ctx.shadowColor = item.sliceBg === "#F59E0B" ? "rgba(255,255,255,0.4)" : "rgba(0,0,0,0.7)";
          ctx.shadowBlur = 4;
          ctx.shadowOffsetX = 1;
          ctx.shadowOffsetY = 1;

          ctx.fillText(item.label, radius - 28, 0);
          ctx.restore();
        }

        // Outer Metallic Ring
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, 2 * Math.PI);
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#D97706";
        ctx.stroke();

        ctx.restore();
      }

      // --- Spin Execution with Physics Easing ---
      function spinWheel() {
        if (isSpinning) return;

        // Unlock audio context on user gesture
        if (!audioCtxInstance) {
          try {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              audioCtxInstance = new AudioContextClass();
            }
          } catch (e) {}
        }
        if (audioCtxInstance && audioCtxInstance.state === "suspended") {
          audioCtxInstance.resume();
        }

        isSpinning = true;
        spinBtn.disabled = true;
        spinBtn.querySelector("span").textContent = "SPINNING…";

        // Pick random slice index (0 to 7)
        var targetIndex = Math.floor(Math.random() * NUM_SLICES);
        var targetItem = WHEEL_ITEMS[targetIndex];

        // Pointer is at TOP: 270 degrees in canvas polar coordinates
        var sliceCenterAngle = (targetIndex + 0.5) * SLICE_ANGLE;
        var phiTarget = (270 - sliceCenterAngle) % 360;
        if (phiTarget < 0) phiTarget += 360;

        // Slight natural jitter inside the slice (+/- 11 degrees, well within 22.5 half-slice)
        var jitter = (Math.random() - 0.5) * 22;

        var fullRevolutions = (5 + Math.floor(Math.random() * 2)) * 360; // 5 to 6 full turns
        var currentMod = currentAngle % 360;
        var deltaAngle = ((phiTarget - currentMod) % 360 + 360) % 360;
        var totalSpinDelta = fullRevolutions + deltaAngle + jitter;

        var startAngle = currentAngle;
        var endAngle = currentAngle + totalSpinDelta;

        var durationMs = 4000; // ~4 seconds as requested
        var startTime = null;

        lastTickIndex = -1;

        function stepSpin(timestamp) {
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;
          var t = Math.min(elapsed / durationMs, 1);

          // Quintic ease-out for realistic friction deceleration
          var easeOut = 1 - Math.pow(1 - t, 4.2);
          var rot = startAngle + (endAngle - startAngle) * easeOut;
          currentAngle = rot;

          drawWheel(rot);

          // Detect slice boundary ticks
          var currentTickIndex = Math.floor(rot / SLICE_ANGLE);
          if (currentTickIndex !== lastTickIndex) {
            lastTickIndex = currentTickIndex;
            playTickSound();
          }

          if (t < 1) {
            requestAnimationFrame(stepSpin);
          } else {
            // Spin Finished
            isSpinning = false;
            spinCount++;

            // Update spin badges
            spinCounterBadge.style.display = "inline-block";
            spinCounterBadge.textContent = "Spin #" + spinCount;
            spinAgainCounter.textContent = "(Spin #" + (spinCount + 1) + ")";

            flashCelebrationBulbs();

            // Reveal Result Card after a tiny celebratory pause
            setTimeout(function () {
              showResult(targetItem);
              spinBtn.disabled = false;
              spinBtn.querySelector("span").textContent = "SPIN THE WHEEL";
            }, 300);
          }
        }

        requestAnimationFrame(stepSpin);
      }

      // --- Show Result Card ---
      function showResult(item) {
        resultEmoji.textContent = item.emoji;
        resultTagTitle.textContent = item.tagTitle;
        resultCaption.textContent = item.caption;

        // WhatsApp Share Link
        var currentUrl = window.location.href.split("#")[0];
        var shareText = "The wheel says I’m " + item.tagTitle + " " + item.emoji + ". What are you? " + currentUrl;
        whatsappShareBtn.href = "https://wa.me/?text=" + encodeURIComponent(shareText);

        resultOverlay.classList.add("active");
      }

      function closeResult() {
        resultOverlay.classList.remove("active");
      }

      // --- Copy Link with Toast ---
      function copyPageLink() {
        var urlToCopy = window.location.href.split("#")[0];
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(urlToCopy).then(showToast).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        var input = document.createElement("input");
        input.value = window.location.href.split("#")[0];
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand("copy");
          showToast();
        } catch (err) {}
        document.body.removeChild(input);
      }

      function showToast() {
        copyBtnText.textContent = "Copied!";
        toast.classList.add("show");
        setTimeout(function () {
          copyBtnText.textContent = "Copy";
          toast.classList.remove("show");
        }, 2200);
      }

      // --- Theme Toggle ---
      function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") {
          themeIcon.textContent = "☀️";
          themeLabel.textContent = "Light";
        } else {
          themeIcon.textContent = "🌙";
          themeLabel.textContent = "Dark";
        }
      }

      function toggleTheme() {
        var currentTheme = document.documentElement.getAttribute("data-theme");
        var nextTheme = currentTheme === "light" ? "dark" : "light";
        setTheme(nextTheme);
      }

      // --- Event Listeners ---
      spinBtn.addEventListener("click", spinWheel);
      canvas.addEventListener("click", spinWheel);
      spinAgainBtn.addEventListener("click", function () {
        closeResult();
        // Give a slight smooth pause before readying
      });

      resultOverlay.addEventListener("click", function (e) {
        if (e.target === resultOverlay) {
          closeResult();
        }
      });

      copyLinkBtn.addEventListener("click", copyPageLink);
      themeToggleBtn.addEventListener("click", toggleTheme);

      window.addEventListener("resize", function () {
        setupBulbs();
        drawWheel(currentAngle);
      });

      // Initialize
      setupBulbs();
      drawWheel(0);
      animateBulbs();

      // Respect system color scheme preference initially
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
        // By default per brief: dark violet background is signature look, but user can toggle anytime
      }
    })();
  </script>
</body>
</html>
