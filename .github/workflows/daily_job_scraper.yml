name: Automated Daily Product Management Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & JobSpy
        working-directory: ./StepSmart-website-final
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 requests pydantic curl_cffi markdownify
          pip install -e ./JobSpy

      - name: Execute Daily Multi-Portal PM Job Scraper (JobSpy Engine)
        working-directory: ./StepSmart-website-final
        env:
          GOOGLE_DOC_WEBHOOK_URL: ${{ secrets.GOOGLE_DOC_WEBHOOK_URL }}
        run: |
          python run_daily_job_scraper.py
          mkdir -p ../stepsmart-nextjs/public/jobs/data ../frontend/public/jobs/data
          cp data/jobs.json ../stepsmart-nextjs/public/jobs/data/jobs.json || true
          cp data/jobs.json ../frontend/public/jobs/data/jobs.json || true
          cp data/daily_pm_jobs_google_doc.md ../stepsmart-nextjs/public/jobs/data/daily_pm_jobs_google_doc.md || true
          cp data/daily_pm_jobs_google_doc.md ../frontend/public/jobs/data/daily_pm_jobs_google_doc.md || true
          cp strict_pm_jobs_all_portals_india.csv ../stepsmart-nextjs/public/jobs/ || true
          cp strict_pm_jobs_all_portals_india.csv ../frontend/public/jobs/ || true

      - name: Commit and Push Updated Job Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Automated daily PM job board refresh"
          file_pattern: "StepSmart-website-final/data/jobs.json StepSmart-website-final/data/daily_pm_jobs_google_doc.md StepSmart-website-final/strict_pm_jobs_all_portals_india.csv stepsmart-nextjs/public/jobs/data/jobs.json frontend/public/jobs/data/jobs.json"
