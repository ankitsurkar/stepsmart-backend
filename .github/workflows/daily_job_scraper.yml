name: Automated Daily Product Management Job Scraper

on:
  schedule:
    # Runs daily at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & JobSpy
        working-directory: ./StepSmart-website-final
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 requests pydantic curl_cffi markdownify
          pip install -e ./JobSpy

      - name: Execute Daily Multi-Portal PM Job Scraper (JobSpy Engine)
        working-directory: ./StepSmart-website-final
        run: |
          python run_daily_job_scraper.py

      - name: Commit and Push Updated Job Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Automated daily PM job board refresh [skip ci]"
          file_pattern: "StepSmart-website-final/data/jobs.json StepSmart-website-final/strict_pm_jobs_all_portals_india.csv StepSmart-website-final/data/pm_jobs_google_sheets.csv"
