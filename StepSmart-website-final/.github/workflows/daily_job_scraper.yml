name: Automated LinkedIn PM Job Post Scraper

on:
  schedule:
    # Runs every 6 hours automatically in GitHub Cloud
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 requests

      - name: Execute LinkedIn Hidden-Jobs Pipeline
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python pipeline.py

      - name: Commit and Push Updated Job Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Automated LinkedIn PM job board refresh [skip ci]"
          file_pattern: "data/jobs.json data/pm_jobs_google_sheets.csv data/hirer_watchlist.json"
